[project]
name = "crummy"
version = "4.0.0"
description = "Crummy Discord music bot"
requires-python = ">=3.12.16,<3.13"
dependencies = [
  "discord.py>=2.7.1,<3",
  "PyNaCl>=1.6.2,<1.7",
  # discord.py 2.7.1 implements the pre-0.2 DAVE transition API.
  # Keep the version verified in the original audible bot until migrating both.
  "davey==0.1.4",
  "python-dotenv>=1.2.3,<2",
  "yt-dlp[default]>=2026.10.26",
  "requests>=2.34.2,<3",
  "websockets>=17,<18",
  "brotli>=1.2.1",
]

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1", "ruff>=0.14", "pip-audit>=2.9"]

[project.scripts]
bot = "main:run"
test = "pytest:main"

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "config", "constants", "media", "media_worker", "models", "music_bot", "music_commands", "player", "prefixes", "views", "logging_setup"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ASYNC"]
